name: func-${self:service}-${sls:stage}-getTransaction
description: Processes API Gateway GET events to retrieve a single transaction by ID from DynamoDB.
handler: dist/src/infrastructure/inputs/lambdas/get-transaction-handler.handler
timeout: 30
memorySize: 256
environment:
  TRANSACTION_TABLE_NAME: ${self:custom.tranasctionTableName}
  LOG_LEVEL: ${self:custom.logLevel}
events:
  - http:
      path: pagos/{id}
      method: get
      cors: true
