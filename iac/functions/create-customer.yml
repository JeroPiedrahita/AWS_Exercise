name: func-${self:service}-${sls:stage}-createCustomer
description: Processes API Gateway POST events to create a new customer account in DynamoDB.
handler: dist/src/infrastructure/inputs/lambdas/create-customer-handler.handler
timeout: 30
memorySize: 256
environment:
  CUSTOMERS_TABLE_NAME: ${self:custom.customersTableName}
  ACCOUNTS_TABLE_NAME: ${self:custom.accountsTableName} 
  CONFIRMATION_QUEUE_URL: ${self:custom.confirmationQueueUrl}
  LOG_LEVEL: ${self:custom.logLevel}
events:
  - http:
      path: customers
      method: post
      cors: true
